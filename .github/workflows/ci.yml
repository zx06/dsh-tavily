name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Covers the root project AND packages/plugin-kit: the root
      # tsconfig.check.json does not include `packages/`, so the workspace kit
      # would otherwise only be checked indirectly by the build step.
      - name: Typecheck
        run: pnpm typecheck:all

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The bundle is committed so GitHub installs work without a build step.
      # A stale artifact would ship old code, so fail when the committed entry
      # does not match a fresh build.
      - name: Check the committed bundle is up to date
        run: |
          if ! git diff --quiet -- dist/host.js; then
            echo "::error::dist/host.js is out of date. Run 'pnpm build' and commit the result."
            git --no-pager diff --stat -- dist/host.js
            exit 1
          fi

      # `pnpm pack` is what npm publishes: this catches a manifest that omits
      # the entry, the client half, or the cordis patch before a release.
      - name: Verify the publishable tarball
        run: |
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/zx06-tavily-*.tgz | sed 's|^package/||' | sort > /tmp/packed.txt
          for required in package.json dist/host.js client.js cordis.patch.yml README.md LICENSE; do
            grep -qx "$required" /tmp/packed.txt || {
              echo "::error::$required is missing from the published tarball"
              cat /tmp/packed.txt
              exit 1
            }
          done
