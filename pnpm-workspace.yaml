packages:
  # The shared kit is dev-only: `scripts/bundle.mjs` inlines its built output
  # into `dist/host.js`, so consumers never resolve it. Keeping it a workspace
  # package lets the plugin's source and tests import it directly.
  - 'packages/*'

# esbuild ships its native binary through a postinstall script. pnpm blocks
# dependency build scripts by default, and an unapproved script is a hard
# install error (ERR_PNPM_IGNORED_BUILDS) rather than a warning.
#
# Both spellings are listed because the setting was renamed across majors:
# pnpm 10 reads `onlyBuiltDependencies`, pnpm 12 reads `allowBuilds`. Each
# version ignores the key it does not know.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

# `@deepseek-ai/dsh-llm` depends on zod by EXACT version (`"zod": "4.4.3"`, not a
# range), and 4.4.3 predates the fix for a memory-exhaustion advisory in
# oversized constrained collections (patched in 4.6.6). Because the pin is
# exact, only an override can lift it.
#
# This plugin never imports zod: it arrives solely through the dev/peer SDK,
# `dist/host.js` inlines no zod, and the published package declares none. So the
# override changes nothing the plugin ships — it just keeps the dev tree on a
# patched release instead of the advisory range.
overrides:
  zod: ^4.6.7
